<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Андрей Умников</title>
    <meta name="description" content="Личная страница Андрея Умникова" />
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1b1b1f;
        --bg: #fdfdfc;
        --muted: #6b6b70;
        --accent: #2f6f4e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ecece9;
          --bg: #141414;
          --muted: #a0a0a0;
          --accent: #7fc9a2;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font: 17px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      main { max-width: 36rem; }
      h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; margin: 0 0 1rem; }
      p { margin: 0 0 0.75rem; }
      .muted { color: var(--muted); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Андрей Умников</h1>
      <p>Личная страница.</p>
      <p class="muted">Скоро здесь появится больше — пока это стартовая заглушка.</p>
      <p><a href="https://github.com/andreyumnikov">github.com/andreyumnikov</a></p>
    </main>
  </body>
</html>
